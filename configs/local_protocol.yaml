env: local_protocol
device: auto
seed: 42
data:
  train_questions: ./data/v2_OpenEnded_mscoco_train2014_questions.json
  train_annotations: ./data/v2_mscoco_train2014_annotations.json
  val_questions: ./data/v2_OpenEnded_mscoco_val2014_questions.json
  val_annotations: ./data/v2_mscoco_val2014_annotations.json
  train_img_dir: ./data/train2014
  val_img_dir: ./data/val2014
  split_mode: protocol
  num_train_questions: 300
  num_val_questions: 100
  dev_image_fraction: 0.2
  split_seed: 2026
  preload_features: true
  max_missing_feature_frac: 0.01
  num_answers: 50
  max_question_len: 14
  min_word_freq: 1
output_dir: ./outputs/local_protocol
model:
  img_feature_dim: 2048
  text_embed_dim: 128
  lstm_hidden_dim: 256
  common_proj_dim: 512
  dropout_rate: 0.5
  fusion_method: mul
training:
  batch_size: 32
  learning_rate: 0.001
  num_epochs: 3
  early_stopping_patience: 2
  num_workers: 0
  lr_scheduler: plateau
  scheduler_factor: 0.5
  scheduler_patience: 2
features:
  batch_size: 32
